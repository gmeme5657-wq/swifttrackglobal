<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift Courier — Admin Dashboard</title>
<link rel="stylesheet" href="css/style.css?v=luxury4">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg>
        </div>
        <div>
          <div class="brand-name">Swift Courier</div>
          <div class="brand-tag">Operations</div>
        </div>
      </div>
      <nav class="topnav">
        <a href="index.html" class="back-link">← Client view</a>
      </nav>
    </header>

    <main class="container" id="admin-root">
      <div id="admin-gate-wrap"></div>
      <div id="admin-shell" hidden>
        <div class="admin-layout">
          <aside class="admin-sidebar" id="admin-sidebar">
            <button data-sub="overview" class="active">Overview</button>
            <button data-sub="shipments">Shipments</button>
            <button data-sub="drivers">Drivers</button>
            <button data-sub="map">Live map</button>
            <button data-sub="notifications">Notifications</button>
          </aside>
          <div class="admin-main" id="admin-main"></div>
        </div>
      </div>
    </main>

  </div>

<script src="js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/backend.js"></script><script src="js/app.js"></script>
<script src="js/admin-enhancements.js"></script>
</body>
</html>
